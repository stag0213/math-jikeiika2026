<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線分PQが通過してできる図形 S</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:#f7f9fc; }
  #panel {
    position:absolute; top:12px; left:12px; z-index:10; width:320px;
    background:rgba(255,255,255,0.93); border-radius:12px; padding:14px 16px;
    box-shadow:0 4px 18px rgba(0,0,0,0.15); font-size:14px; line-height:1.6;
  }
  #panel h1 { font-size:16px; margin:0 0 8px; }
  #panel .row { margin:6px 0; }
  #panel input[type=range] { width:100%; }
  #panel button { margin-right:6px; padding:4px 12px; border:none; border-radius:6px; background:#3b6fd8; color:#fff; cursor:pointer; }
  #panel button:hover { background:#2c56ad; }
  .coord { font-family:monospace; font-size:14px; }
  .eq { background:#eef3ff; border-radius:6px; padding:6px 8px; font-size:13px; margin-top:8px; }
  .lbl  { font-size:15px; font-weight:bold; color:#222;    text-shadow:0 0 3px #fff,0 0 3px #fff; }
  .lblP { font-size:16px; font-weight:bold; color:#d62828; text-shadow:0 0 3px #fff,0 0 3px #fff; }
  .lblQ { font-size:16px; font-weight:bold; color:#1d4ed8; text-shadow:0 0 3px #fff,0 0 3px #fff; }
  .lblR { font-size:16px; font-weight:bold; color:#2a9d3f; text-shadow:0 0 3px #fff,0 0 3px #fff; }
  .axis { font-size:14px; font-style:italic; color:#555; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1>線分PQが通過してできる図形 S</h1>
  <div class="row">p = <b id="pval">1.00</b>
    <input type="range" id="slider" min="0" max="2" step="0.005" value="1">
  </div>
  <div class="row">
    <button id="play">▶ 再生</button>
    <button id="reset">視点リセット</button>
  </div>
  <div class="row coord">
    <span style="color:#d62828">P</span> = (<span id="P"></span>)<br>
    <span style="color:#1d4ed8">Q</span> = (<span id="Q"></span>)<br>
    <span style="color:#2a9d3f">R</span> = (<span id="R"></span>) <small>※PQ と x=2y の交点</small>
  </div>
  <div class="row">
    <label><input type="checkbox" id="cPlane" checked> 平面PDE</label><br>
    <label><input type="checkbox" id="cGhost" checked> S全体(薄く表示)</label><br>
    <label><input type="checkbox" id="cRule" checked> 通過した線分(母線)</label><br>
    <label><input type="checkbox" id="cTet" checked> 四面体OABC</label><br>
    <label><input type="checkbox" id="cX2y" checked> 平面 x=2y と交わり</label>
  </div>
  <div class="eq">
    平面PDE:(x−p)+(p−1)y+pz=0<br>
    Q = (0, p, 2−p)<br>
    S:z(x+y) = y(2−x−y)<br>
    &nbsp;&nbsp;(x≥0, y≥0, x+y≤2)<br>
    R = (2p/3, p/3, (2−p)/3)
  </div>
  <div style="font-size:12px;color:#666;margin-top:6px;">ドラッグで回転/ホイールで拡大/右ドラッグで平行移動</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const V = (x,y,z) => new THREE.Vector3(x,y,z);

// ---------- 基本セットアップ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf7f9fc);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.up.set(0,0,1);                 // z軸を上に
const camHome = V(5.2, 3.6, 3.0);
const targetHome = V(0.7, 0.7, 0.6);
camera.position.copy(camHome);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(targetHome);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(4,3,6); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.35); dl2.position.set(-3,-2,-2); scene.add(dl2);

// ---------- ヘルパー ----------
function label(text, cls='lbl') {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  return new CSS2DObject(d);
}
function point(pos, color, r=0.045, text=null, cls='lbl', off=V(0.08,0.08,0.08)) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), new THREE.MeshPhongMaterial({ color }));
  m.position.copy(pos);
  if (text) { const l = label(text, cls); l.position.copy(off); m.add(l); }
  scene.add(m); return m;
}
function line(a, b, color=0x888888, dashed=false) {
  const g = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = dashed ? new THREE.LineDashedMaterial({ color, dashSize:0.06, gapSize:0.04 })
                     : new THREE.LineBasicMaterial({ color });
  const l = new THREE.Line(g, mat);
  if (dashed) l.computeLineDistances();
  return l;
}
function makeCylinder(color, r=0.022) {
  return new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 16), new THREE.MeshPhongMaterial({ color }));
}
function cylinder(color, r=0.022) {
  const m = makeCylinder(color, r); scene.add(m); return m;
}
function setCylinder(m, a, b) {
  const d = b.clone().sub(a); const L = d.length();
  m.scale.set(1, Math.max(L,1e-6), 1);
  m.position.copy(a).addScaledVector(d, 0.5);
  if (L > 1e-9) m.quaternion.setFromUnitVectors(V(0,1,0), d.normalize());
}

// ---------- 座標軸 ----------
const axes = [[V(1,0,0),'x'],[V(0,1,0),'y'],[V(0,0,1),'z']];
for (const [dir, name] of axes) {
  scene.add(new THREE.ArrowHelper(dir, dir.clone().multiplyScalar(-0.4), 3.1, 0x555555, 0.12, 0.06));
  const l = label(name, 'axis'); l.position.copy(dir.clone().multiplyScalar(2.85)); scene.add(l);
}

// ---------- 定点 ----------
const O = V(0,0,0), A = V(2,0,0), B = V(0,2,0), C = V(0,0,2), D = V(1,1,0), E = V(0,0,1);
point(O, 0x222222, 0.04, 'O', 'lbl', V(-0.12,-0.12,-0.05));
point(A, 0x222222, 0.04, 'A');
point(B, 0x222222, 0.04, 'B');
point(C, 0x222222, 0.04, 'C');
point(D, 0x2a9d8f, 0.05, 'D');
point(E, 0x2a9d8f, 0.05, 'E', 'lbl', V(-0.15,-0.05,0));

// 四面体 OABC
const tet = new THREE.Group();
for (const [a,b] of [[O,A],[O,B],[O,C],[A,B],[B,C],[C,A]]) tet.add(line(a,b,0x999999,true));
scene.add(tet);
// 直線BC(強調)
const bcLine = cylinder(0x1d4ed8, 0.01); setCylinder(bcLine, B, C);
bcLine.material.transparent = true; bcLine.material.opacity = 0.5;

// ---------- 曲面 S ----------
// 線分PQ上の点:(p(1-t), pt, (2-p)t)
function surfaceGeometry(pMax, nu=90, nv=24) {
  const pos=[], col=[], idx=[]; const c = new THREE.Color();
  for (let i=0;i<=nu;i++) {
    const p = pMax*i/nu;
    c.setHSL(0.62 - 0.55*(p/2), 0.75, 0.55);
    for (let j=0;j<=nv;j++) {
      const t = j/nv;
      pos.push(p*(1-t), p*t, (2-p)*t);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i=0;i<nu;i++) for (let j=0;j<nv;j++) {
    const a = i*(nv+1)+j, b = a+nv+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// 全体(薄いワイヤーフレーム)
const ghost = new THREE.Mesh(surfaceGeometry(2, 40, 10),
  new THREE.MeshBasicMaterial({ color:0x8899bb, wireframe:true, transparent:true, opacity:0.18 }));
scene.add(ghost);
// 通過済み部分
const sweptMat = new THREE.MeshPhongMaterial({ vertexColors:true, side:THREE.DoubleSide,
  transparent:true, opacity:0.82, shininess:40 });
const swept = new THREE.Mesh(new THREE.BufferGeometry(), sweptMat);
scene.add(swept);
// 母線
const rulings = new THREE.LineSegments(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color:0x444466, transparent:true, opacity:0.55 }));
scene.add(rulings);

// ---------- 平面PDE ----------
const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6),
  new THREE.MeshPhongMaterial({ color:0xf4a261, transparent:true, opacity:0.22,
    side:THREE.DoubleSide, depthWrite:false }));
scene.add(planeMesh);
const triPDE = new THREE.Group(); scene.add(triPDE);

// ---------- 平面 x = 2y ----------
const x2y = new THREE.Group(); scene.add(x2y);
{
  // 平面内の水平方向 u=(2,1,0)/√5 と鉛直方向 z で長方形を作る
  const u = V(2,1,0).normalize();
  const s0 = -0.3, s1 = 2.5, z0 = -0.3, z1 = 2.5;
  const c = (s,z) => u.clone().multiplyScalar(s).add(V(0,0,z));
  const g = new THREE.BufferGeometry().setFromPoints([c(s0,z0), c(s1,z0), c(s1,z1), c(s0,z1)]);
  g.setIndex([0,1,2, 0,2,3]); g.computeVertexNormals();
  x2y.add(new THREE.Mesh(g, new THREE.MeshPhongMaterial({
    color:0x52b788, transparent:true, opacity:0.22, side:THREE.DoubleSide, depthWrite:false })));
  // 平面の枠
  x2y.add(line(c(s0,z0), c(s1,z0), 0x52b788)); x2y.add(line(c(s1,z0), c(s1,z1), 0x52b788));
  x2y.add(line(c(s1,z1), c(s0,z1), 0x52b788)); x2y.add(line(c(s0,z1), c(s0,z0), 0x52b788));
  const lp = label('x = 2y', 'axis'); lp.element.style.color = '#2d6a4f';
  lp.position.copy(c(s1, z1)).add(V(0,0,0.1)); x2y.add(lp);

  // 四面体OABCの切り口 三角形 O, C, (4/3, 2/3, 0)
  const F = V(4/3, 2/3, 0);
  for (const [a,b] of [[O,C],[C,F],[F,O]]) x2y.add(line(a,b,0x2d6a4f,true));
  const lf = label('(4/3, 2/3, 0)', 'axis'); lf.position.copy(F).add(V(0.1,0.1,-0.1)); x2y.add(lf);

  // S との交わり:線分 OC と 線分 (0,0,2/3)–(4/3,2/3,0)
  const tube = (a,b) => { const m = makeCylinder(0x2a9d3f, 0.018); setCylinder(m,a,b); return m; };
  x2y.add(tube(O, C));
  x2y.add(tube(V(0,0,2/3), F));
  const m23 = new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16), new THREE.MeshPhongMaterial({ color:0x2a9d3f }));
  m23.position.set(0,0,2/3); x2y.add(m23);
  const l23 = label('(0, 0, 2/3)', 'axis'); l23.position.set(-0.35,0,2/3); x2y.add(l23);
}

// ---------- 動く点・線分 ----------
const Pm = point(V(1,0,0), 0xd62828, 0.06, 'P', 'lblP', V(0.05,-0.15,-0.1));
const Qm = point(V(0,1,1), 0x1d4ed8, 0.06, 'Q', 'lblQ', V(-0.1,0.1,0.12));
const PQ = cylinder(0xe63946, 0.022);

// PQ と 平面 x=2y の交点 R
const Rm = new THREE.Mesh(new THREE.SphereGeometry(0.055,20,20), new THREE.MeshPhongMaterial({ color:0x2a9d3f }));
{ const l = label('R', 'lblR'); l.position.set(0.1,-0.1,0.1); Rm.add(l); }
x2y.add(Rm);

// ---------- 更新 ----------
const ui = {
  slider: document.getElementById('slider'), pval: document.getElementById('pval'),
  P: document.getElementById('P'), Q: document.getElementById('Q'), R: document.getElementById('R')
};

function update(p) {
  const P = V(p,0,0), Q = V(0,p,2-p);
  Pm.position.copy(P); Qm.position.copy(Q);
  setCylinder(PQ, P, Q);

  // 曲面(0〜p)
  swept.geometry.dispose();
  if (p > 1e-3) { swept.geometry = surfaceGeometry(p, Math.max(2, Math.round(90*p/2)), 24); swept.visible = true; }
  else swept.visible = false;

  // 母線
  const pts = [];
  for (let k=0; k<=40; k++) { const q = 2*k/40; if (q > p + 1e-9) break;
    pts.push(q,0,0, 0,q,2-q); }
  rulings.geometry.dispose();
  rulings.geometry = new THREE.BufferGeometry();
  rulings.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));

  // 平面PDE:法線 n = (1, p-1, p)
  const n = V(1, p-1, p).normalize();
  planeMesh.quaternion.setFromUnitVectors(V(0,0,1), n);
  planeMesh.position.copy(P.clone().add(D).add(E).add(Q).multiplyScalar(0.25));

  // 三角形PDE の辺
  triPDE.children.forEach(o => o.geometry.dispose());
  triPDE.clear();
  for (const [a,b] of [[P,D],[D,E],[E,P]]) triPDE.add(line(a,b,0xe76f51,true));

  // 交点 R(t = 1/3)
  Rm.position.set(2*p/3, p/3, (2-p)/3);

  ui.pval.textContent = p.toFixed(2);
  ui.P.textContent = `${p.toFixed(2)}, 0, 0`;
  ui.Q.textContent = `0, ${p.toFixed(2)}, ${(2-p).toFixed(2)}`;
  ui.R.textContent = `${(2*p/3).toFixed(2)}, ${(p/3).toFixed(2)}, ${((2-p)/3).toFixed(2)}`;
}

let p = 1; update(p);
ui.slider.addEventListener('input', e => { p = parseFloat(e.target.value); update(p); });

let playing = false, dir = 1;
const playBtn = document.getElementById('play');
playBtn.onclick = () => {
  playing = !playing; playBtn.textContent = playing ? '⏸ 停止' : '▶ 再生';
  if (playing && p >= 2) { p = 0; dir = 1; }
};
document.getElementById('reset').onclick = () => { camera.position.copy(camHome); controls.target.copy(targetHome); };

const bind = (id, obj) => document.getElementById(id).addEventListener('change', e => {
  [].concat(obj).forEach(o => o.visible = e.target.checked); });
bind('cPlane', [planeMesh, triPDE]);
bind('cGhost', ghost);
bind('cRule', rulings);
bind('cTet', tet);
bind('cX2y', x2y);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  if (playing) {
    p += dir * 0.006;
    if (p >= 2) { p = 2; dir = -1; }
    if (p <= 0) { p = 0; dir = 1; }
    ui.slider.value = p; update(p);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
</script>
</body>
</html>
